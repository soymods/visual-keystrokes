plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Bundled into the mod jar.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:${rootProject.neoforge_version}"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')
}

// Accept any NeoForge build for this Minecraft version, e.g. 21.8.54 -> [21.8,)
def neoForgeDependency = rootProject.neoforge_version.toString().tokenize('.').take(2).join('.')

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_dependency', rootProject.minecraft_version
    inputs.property 'neoforge_dependency', neoForgeDependency

    filesMatching('META-INF/neoforge.mods.toml') {
        expand 'version': project.version,
                'minecraft_dependency': rootProject.minecraft_version,
                'neoforge_dependency': neoForgeDependency
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
    from(rootProject.file('LICENSE.txt')) {
        rename { "${it}_${rootProject.archives_base_name}" }
    }
}

remapJar {
    inputFile.set shadowJar.archiveFile
}
