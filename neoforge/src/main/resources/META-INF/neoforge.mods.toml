modLoader = "javafml"
loaderVersion = "[4,)"
license = "All Rights Reserved"
issueTrackerURL = "https://github.com/soymods/visual-keystrokes/issues"

[[mods]]
modId = "visualkeystrokes"
version = "${version}"
displayName = "Visual Keystrokes"
description = "Highly customizable keystroke and mouse overlay."
authors = "soymods"
displayURL = "https://github.com/soymods/visual-keystrokes"
logoFile = "assets/visualkeystrokes/logo.png"
