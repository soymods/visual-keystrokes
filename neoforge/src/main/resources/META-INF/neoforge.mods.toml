displayTest = "IGNORE_ALL_VERSION"

[[dependencies.visualkeystrokes]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_dependency},)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.visualkeystrokes]]
modId = "minecraft"
type = "required"
